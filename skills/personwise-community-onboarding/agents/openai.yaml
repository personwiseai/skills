interface:
  display_name: Community Onboarding
  short_description: Turn community guidelines into an askable digital-human start-here course.
  default_prompt: Use $personwise-community-onboarding to build a community onboarding course from our guidelines.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
