interface:
  display_name: Content Repurposing
  short_description: Turn recordings and transcripts into an askable digital-human course.
  default_prompt: Use $personwise-content-repurposing to build a course by repurposing our webinar recordings.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
