interface:
  display_name: Employee Onboarding Course
  short_description: Turn your handbook into an askable digital-human new-hire course.
  default_prompt: Use $personwise-employee-onboarding to build a new hire onboarding course from our handbook.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
