interface:
  display_name: Security Awareness Training
  short_description: Turn security policies into an askable digital-human awareness course.
  default_prompt: Use $personwise-security-awareness-training to build a security awareness training course from our security policies.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
