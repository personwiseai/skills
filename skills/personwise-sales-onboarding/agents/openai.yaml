interface:
  display_name: Sales Onboarding
  short_description: Turn your sales playbook into an askable digital-human new-rep ramp course.
  default_prompt: Use $personwise-sales-onboarding to build a sales onboarding course from our sales playbook.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
