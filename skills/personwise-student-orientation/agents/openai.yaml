interface:
  display_name: Student Orientation
  short_description: Turn orientation materials into an askable digital-human new-student course.
  default_prompt: Use $personwise-student-orientation to build a student orientation course from our handbook.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
