interface:
  display_name: Compliance Training
  short_description: Turn policies into an askable digital-human compliance course.
  default_prompt: Use $personwise-compliance-training to build a compliance training course from our policy documents.
dependencies:
  tools:
  - type: mcp
    value: personwise-course-creation
    description: Create and publish PersonWise courses with OAuth
    transport: streamable_http
    url: https://mcp.personwise.ai/mcp
policy:
  allow_implicit_invocation: true
